# CI for the Rust crates and their bindings (packages/*/rust, packages/*/python,
# packages/*/node/binding). Runs beside the main CI;
# the TypeScript packages are built here only because the conformance suite
# compares the Rust binding against them.

name: Rust

on:
    push:
        branches: [develop, master, next, beta, alpha]
    pull_request:
        branches: [develop, master, next, beta, alpha]

permissions:
    contents: read

env:
    PRIMARY_NODE_VERSION: 22
    CARGO_TERM_COLOR: always

jobs:
    core:
        name: Rust (fmt, clippy, test)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            # reads rust-toolchain.toml (pinned channel, default profile with
            # rustfmt and clippy) and caches the cargo registry and target
            -   name: Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1

            -   name: Format
                run: cargo fmt --all --check

            -   name: Clippy
                run: cargo clippy --workspace --all-targets -- -D warnings

            # unit tests, the README doctest and both conformance fixture suites
            -   name: Test
                run: cargo test --workspace

            # every publishable crate in dependency order (rapiq-core, rapiq)
            -   name: Package (crates.io dry run)
                run: cargo publish --workspace --dry-run

    node:
        name: Node binding (${{ matrix.os }})
        needs: [core]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

            -   name: Build
                uses: ./.github/actions/build

            -   name: Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1

            -   name: Build binding
                working-directory: packages/core/node/binding
                run: npm run build

            # every fixture against the TypeScript reference and the Rust
            # binding side by side
            -   name: Conformance
                working-directory: conformance
                run: npx vitest run --config test/vitest.config.ts

    python:
        name: Python binding (${{ matrix.python }})
        needs: [core]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # abi3: the oldest and the newest supported interpreter
                python: ['3.9', '3.13']
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Python
                uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.python }}

            -   name: Rust toolchain
                uses: actions-rust-lang/setup-rust-toolchain@v1

            # builds the rapiq-core wheel and the umbrella, then installs the
            # umbrella the way a user would: it must pull in rapiq-core
            -   name: Build and install
                run: |
                    python -m pip install --upgrade pip maturin build pytest
                    (cd packages/core/python && maturin build --release --out dist)
                    (cd packages/rapiq/python && python -m build --outdir dist .)
                    python -m pip install --no-index \
                        --find-links packages/core/python/dist \
                        --find-links packages/rapiq/python/dist \
                        rapiq

            -   name: Conformance
                working-directory: packages/core/python
                run: python -m pytest
