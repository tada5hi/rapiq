[workspace]
resolver = "3"
members = [
    "packages/*/rust",
    "packages/*/node/binding",
    "packages/*/python",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Peter Placzek <peter.placzek1996@gmail.com>"]
homepage = "https://rapiq.tada5hi.net"
repository = "https://github.com/tada5hi/rapiq"
publish = false

[workspace.dependencies]
# internal crates (the version is required for publishing dependents)
rapiq-core = { path = "packages/core/rust", version = "0.0.0" }
rapiq-binding-support = { path = "packages/binding-support/rust" }

mimalloc = { version = "0.1", default-features = false }
napi = "3.14.2"
napi-build = "2.6.0"
napi-derive = "3.6.12"
pyo3 = { version = "0.29.3", features = ["abi3-py39"] }
regex = "1.13.1"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# groups at priority -1 so single rules can still be overridden
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
