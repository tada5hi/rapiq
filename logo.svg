<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="rapiq">
    <defs>
        <linearGradient id="rq-grad" x1="4" y1="116" x2="116" y2="4" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4338ca"/>
            <stop offset="1" stop-color="#db2777"/>
        </linearGradient>
        <linearGradient id="rq-shine" x1="60" y1="4" x2="60" y2="74" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#rq-grad)"/>
    <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#rq-shine)"/>
    <!-- Q monogram: the query, and the last letter of rapiq -->
    <g stroke="#ffffff" stroke-linecap="round">
        <circle cx="58" cy="54" r="26" stroke-width="9.5"/>
        <path d="M64 62 90 90" stroke-width="10.5"/>
    </g>
</svg>
