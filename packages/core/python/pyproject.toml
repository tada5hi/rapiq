[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rapiq-core"
description = "Core of rapiq (REST API query) for Python: expression parser and in-memory filter evaluation on the rapiq Rust core. Imported as rapiq.core; install the umbrella `rapiq` for the whole ecosystem."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peter Placzek", email = "peter.placzek1996@gmail.com" }]
dynamic = ["version"]
keywords = ["rest", "api", "query", "filter", "json-api"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://rapiq.tada5hi.net"
Repository = "https://github.com/tada5hi/rapiq"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "src"
module-name = "rapiq.core._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
