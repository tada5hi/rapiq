[package]
name = "rapiq-core-py"
description = "Python binding (PyO3) of rapiq-core, distributed on PyPI as rapiq-core (import rapiq.core)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
rapiq-binding-support = { workspace = true }
rapiq-core = { workspace = true }
