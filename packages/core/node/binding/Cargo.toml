[package]
name = "rapiq-core-node"
description = "Node.js binding (napi-rs) of rapiq-core (proof of concept)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = ["conformance"]
# the proof-of-concept expression parser and evaluator, used by the
# conformance suite and benchmarks; left out of the WASM build, whose size
# follows what it exposes (see D2 in internal-docs/rust/MIGRATION.md)
conformance = []

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
rapiq-binding-support = { workspace = true }
rapiq-core = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
